[package]
name = "hams-polish"
version = "0.1.0"
edition = "2021"
description = "Helper process for hams: cleans up dictated text with a small local language model (llama.cpp)."

[[bin]]
name = "hams-polish"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1", default-features = false }
