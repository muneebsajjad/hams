[package]
name = "hams"
version = "0.1.0"
edition = "2021"
description = "Local voice dictation. Hold a key, speak, release."

[workspace]
members = ["crates/platform", "crates/polish"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hams-platform = { path = "crates/platform" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
